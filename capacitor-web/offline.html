<!doctype html>
<!--
  Quando il sito non si apre (server.errorPath in capacitor.config.json). Qui i
  plugin di Capacitor non ci sono: solo HTML.

  ⚠️ Il PRIMO caricamento dopo che l'app e' stata chiusa, senza rete, salta il
  service worker e fallisce subito (ERR_NAME_NOT_RESOLVED, provato su Android 13
  con WebView 156); il secondo lo serve il service worker. Quindi si riprova da
  soli una volta, a pagina nascosta. La si mostra solo se fallisce anche quello:
  e' la prima apertura in assoluto, senza niente in cache. Il limite di 10 secondi
  evita di riprovare all'infinito.
-->
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProgettoPalestra</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: #f4f6fb;
        font: 16px/1.45 system-ui, sans-serif;
        text-align: center;
      }
      main {
        padding: 24px;
        max-width: 340px;
      }
      p {
        color: rgba(244, 246, 251, 0.68);
        font-size: 14px;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 28px;
        border-radius: 999px;
        background: #5cc8f5;
        color: #000;
        font-weight: 600;
        text-decoration: none;
      }
      .riprovo main {
        visibility: hidden;
      }
    </style>
    <script>
      ;(function () {
        var ultimo = 0
        try {
          ultimo = +sessionStorage.getItem('riprovato') || 0
          if (Date.now() - ultimo < 10000) return
          sessionStorage.setItem('riprovato', Date.now())
        } catch (e) {
          return
        }
        var html = document.documentElement
        html.className = 'riprovo'
        // Se il secondo tentativo resta appeso, il tasto deve comparire lo stesso.
        setTimeout(function () {
          html.className = ''
        }, 8000)
        location.replace('https://progettopalestra.it/')
      })()
    </script>
  </head>
  <body>
    <main>
      <h1 style="font-size: 20px">Non riesco ad aprire ProgettoPalestra</h1>
      <p>Controlla la connessione e riprova. Dopo la prima apertura l’app funziona anche senza rete.</p>
      <a href="https://progettopalestra.it/">Riprova</a>
    </main>
  </body>
</html>

<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- La barra di sistema segue lo sfondo dell'app. Un valore solo, riscritto
         dallo script qui sotto e da lib/tema.js: con due varianti `media`
         seguirebbe il telefono e resterebbe ferma quando lo sfondo lo si
         cambia a mano dal menu. -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ProgettoPalestra1.0" />
    <!-- Titolo e descrizione sono quello che Google mostra nei risultati: li
         legge chi l'app non la conosce ancora. Il nome sotto l'icona viene da
         apple-mobile-web-app-title qui sopra e dal manifest, non da qui.
         Il canonical tiene insieme www, *.vercel.app e /?code=... (le pagine
         dell'app hanno gia' noindex dal server, vedi vercel.json). -->
    <title>ProgettoPalestra1.0 — Schede di allenamento e dieta</title>
    <meta name="description" content="Schede di allenamento, timer di recupero, storico dei progressi e dieta con i macro: la palestra in un'app sola, dal telefono." />
    <link rel="canonical" href="https://progettopalestra.it/" />
    <!-- L'anteprima quando il link si manda su WhatsApp, Telegram e simili. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProgettoPalestra1.0" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:url" content="https://progettopalestra.it/" />
    <meta property="og:title" content="ProgettoPalestra1.0 — Schede di allenamento e dieta" />
    <meta property="og:description" content="Schede di allenamento, timer di recupero, storico dei progressi e dieta con i macro: la palestra in un'app sola, dal telefono." />
    <meta property="og:image" content="https://progettopalestra.it/pwa-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <script>
      // I colori PRIMA del primo pixel. Deve stare qui, in linea e bloccante:
      // fatto da React la pagina nascerebbe col colore sbagliato e
      // lampeggerebbe a ogni apertura. Niente conti qui: src/lib/tema.js
      // salva le variabili gia' calcolate, e qui si appoggiano e basta.
      // Senza una scelta salvata: nero e celeste (il blocco scuro di index.css).
      // ⚠️ Le chiavi e la forma sono quelle di src/lib/tema.js (CHIAVE,
      // CHIAVE_VECCHIA, scriviColori).
      ;(function () {
        var radice = document.documentElement
        var salvati = null
        var vecchio = null
        try {
          salvati = JSON.parse(localStorage.getItem('palestra:colori:v1') || 'null')
          vecchio = localStorage.getItem('palestra:tema:v1')
        } catch (e) {
          // navigazione privata o valore rotto: si parte dal default
        }
        var meta = document.querySelector('meta[name="theme-color"]')
        if (salvati && salvati.vars && salvati.tema) {
          radice.dataset.tema = salvati.tema
          for (var k in salvati.vars) radice.style.setProperty(k, salvati.vars[k])
          meta.content = salvati.vars['--bg']
        } else if (vecchio === 'chiaro') {
          // chi col vecchio interruttore aveva scelto il bianco lo ritrova
          radice.dataset.tema = 'chiaro'
          meta.content = '#ffffff'
        } else {
          radice.dataset.tema = 'scuro'
          meta.content = '#000000'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

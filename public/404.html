<!doctype html>
<!--
  La pagina che Vercel mostra, con stato 404, per ogni indirizzo che non esiste
  (progettopalestra.it/ciaociao). Sta fuori dall'app apposta: le pagine vere
  sono tutte dopo il # (lib/router.js), quindi un percorso diverso da / non e'
  mai dell'app. Anche il service worker lo sa (navigateFallbackAllowlist in
  vite.config.js). Colori: il default dell'app, nero e celeste (index.css).
-->
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Pagina non trovata · ProgettoPalestra1.0</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        box-sizing: border-box;
        background: #000000;
        color: #f3f5f9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 24px;
        color: #98a2b3;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 12px;
        background: #5cc8f5;
        color: #04202e;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-192.png" alt="" />
      <h1>Pagina non trovata</h1>
      <p>L'indirizzo che hai aperto non esiste.</p>
      <a href="/">Vai a ProgettoPalestra</a>
    </main>
  </body>
</html>
